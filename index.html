  var $el = $(el);
  var $table = $el.find('table');
  var table = $el.data('datatable');
  if (!table) return;

  // Calculate height minus surrounding elements (search, pagination, info)

  var wrapperHeight = wrapper.outerHeight(true) - wrapper.height();
  var otherHeight = 0;
  
  wrapper.children().not('.dataTables_scroll').each(function() {
